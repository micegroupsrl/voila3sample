<mat-card>
    <mat-card-title>Registration</mat-card-title>
    <mat-card-content fxLayout="row" fxLayoutAlign="center center">
<style>
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}
</style>
        <form (keydown.enter)="$event.preventDefault()" th:action="@{/register}" class="auth-form" [formGroup]="userForm">
            <p>
                <mat-form-field>
                    <mat-icon matPrefix fontIcon="perm_identity"></mat-icon>
                    <input matInput id="username" maxlength="10" placeholder="Username" formControlName="username" />
                    <label for="username" class="visually-hidden">Username</label>
                </mat-form-field>
            </p>
            <p>
                <mat-form-field>
                    <mat-icon matPrefix fontIcon="lock_outline"></mat-icon>
                    <input matInput id="password" #password maxlength="10" type="password" placeholder="Password" formControlName="password" />
                    <label for="password" class="visually-hidden">Password</label>
                </mat-form-field>
            </p>
            <p>
                <mat-form-field>
                    <mat-icon matPrefix fontIcon="mail_outline"></mat-icon>
                    <input matInput id="email" maxlength="30" placeholder="Email" formControlName="email" />
                    <label for="email" class="visually-hidden">Email</label>
                </mat-form-field>
            </p>
            <div class="button">
                <button mat-button color="primary" routerLink="/login">Sign in</button>
                <button mat-button color="primary" (click)="register()">Submit</button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
