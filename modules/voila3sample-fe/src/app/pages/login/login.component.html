<mat-card>
    <mat-card-title>Login</mat-card-title>
    <mat-card-content fxLayout="row" fxLayoutAlign="center center">
<style>
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}
</style>
        <form (keydown.enter)="$event.preventDefault(); submit()" th:action="@{/login}" class="auth-form" [formGroup]="loginForm">
            <p>
                <mat-form-field>
                    <mat-icon matPrefix fontIcon="perm_identity"></mat-icon>
                    <input matInput id="login-username" maxlength="10" placeholder="Username" formControlName="username" />
                    <label for="login-username" class="visually-hidden">Username</label>
                </mat-form-field>
            </p>
            <p>
                <mat-form-field>
                    <mat-icon matPrefix fontIcon="lock_outline"></mat-icon>
                    <input matInput id="login-password" #password maxlength="10" type="password" placeholder="Password" formControlName="password" />
                    <label for="login-password" class="visually-hidden">Password</label>
                </mat-form-field>
            </p>
            <div class="button">
                <button mat-button color="primary" routerLink="/registration">Sign up</button>
                <button mat-button color="primary" (click)="submit()">Submit</button>
            </div>
        </form>
    </mat-card-content>
</mat-card>
